<!DOCTYPE html>
<html lang="en" class="light scroll-smooth" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>New Radhaswami Mobile Gallery — Flagship Smartphones &amp; Electronics, Pithampur</title>
  <meta name="description" content="New Radhaswami Mobile &amp; Electronics Gallery, Vijay Nagar Colony, Pithampur Industrial Area, Madhya Pradesh. Official partner for Apple, Samsung, Google Pixel, OnePlus. Hotline: +91 96910 11335." />
  <meta name="google-site-verification" content="google94465b4f6be3ad13" />
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
  
  <!-- Official Store Favicon -->
  <link rel="icon" type="image/png" href="/nrs-logo.png" />
  <link rel="apple-touch-icon" href="/nrs-logo.png" />

  <!-- Pre-render Theme Detection (Zero-flicker Light by default) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('radhaswami_theme');
        var theme = (saved === 'dark') ? 'dark' : 'light';
        var root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
          root.setAttribute('data-theme', 'dark');
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
          root.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Luxury Typography: Cormorant Garamond (Editorial Serif) + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F8F9FB] dark:bg-[#030705] text-[#0A0B0E] dark:text-[#E8EFEA] antialiased selection:bg-[#00FF87] selection:text-black overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
